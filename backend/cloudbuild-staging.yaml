steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tunnel/parity-backend:$COMMIT_SHA
      - .
    dir: backend

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tunnel/parity-backend:$COMMIT_SHA

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - parity-backend
      - --platform=managed
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tunnel/parity-backend:$COMMIT_SHA
      - --region=us-central1
      - --memory=12Gi
      - --cpu=4
      - --timeout=1200
      - --concurrency=80
      - --min-instances=0
      # Cap of 2 (not 3): 4 CPU/12Gi x 3 instances per backend overran the
      # regional CPU/memory quotas (CpuAllocPerProjectRegion 20 vCPU,
      # MemAllocPerProjectRegion 40 GiB) when deploys overlapped. A manual
      # `gcloud run services update` cap is reset by this flag on every
      # deploy, so the cap must live here.
      - --max-instances=2
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tunnel/parity-backend:$COMMIT_SHA
